# ──────────────────────────────────────────────────────────────
# CI Test Properties
# These override application.properties when the 'ci' profile
# is active (via -Dspring.profiles.active=ci in GitHub Actions).
# No real AWS services are used.
# ──────────────────────────────────────────────────────────────

server.port=0

# Allow @Primary beans in IntegrationTestBeanConfig to override
# the real beans from DynamoDbConfig and MqttConfig.
spring.main.allow-bean-definition-overriding=true

# Fake AWS credentials (values come from env vars set in CI)
aws.accessKeyId=${AWS_ACCESS_KEY_ID:fakeKey}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:fakeSecret}
aws.region=${AWS_REGION:eu-north-1}
aws.dynamodb.tableName=${AWS_DYNAMODB_TABLE:ir_cracks_detection_test}

# Disable MQTT auto-startup so no real broker connection is attempted
aws.iot.auto-startup=false
aws.iot.broker.url=${AWS_IOT_BROKER_URL:tcp://localhost:1883}
aws.iot.broker.clientId=${AWS_IOT_CLIENT_ID:test-client-ci}
aws.iot.topic.filter=${AWS_IOT_TOPIC_FILTER:test/cracks}
