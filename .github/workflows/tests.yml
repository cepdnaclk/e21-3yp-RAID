name: Run Automated Tests

on:
  push:
  pull_request:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: Spring Boot + JUnit 5 + Mockito
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Unit Tests (Spring Boot + JUnit/Mockito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x webapp-backend/mvnw

      - name: Run Backend Tests
        run: |
          cd webapp-backend
          ./mvnw test --no-transfer-progress

      - name: Publish Backend Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'webapp-backend/target/surefire-reports/TEST-*.xml'
          check_name: 'Backend JUnit Test Report'
          fail_on_failure: true

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: Vite + Vitest + React Testing Library
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend Unit Tests (Vite + Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install Dependencies
        run: |
          cd webapp
          npm ci

      - name: Run Frontend Tests
        run: |
          cd webapp
          npm run test
