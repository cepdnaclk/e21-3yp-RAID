name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'webapp-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        working-directory: webapp-backend
        run: ./mvnw clean package -DskipTests

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "webapp-backend/target/*.jar"
          target: "/opt/app"
          strip_components: 2
          overwrite: true

      - name: Rename and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            mv *.jar app.jar
            sudo systemctl restart webapp-backend